services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_service
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      - db

  redis:
    container_name: redis
    image: "redis"
    ports:
      - "6379:6379"

  db:
    image: postgres:14
    container_name: postgres_db
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  worker:
    build:
      context: .
    env_file:
      - ./.env
    depends_on:
      - redis
      - db
      - web
    command: celery -A config.celery.app worker --loglevel=info

  beat:
    build:
      context: .
    env_file:
      - ./.env
    depends_on:
      - redis
      - db
      - web
    command: celery -A config.celery.app beat --loglevel=info

volumes:
  postgres_data: